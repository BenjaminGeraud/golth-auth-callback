<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>GOLTH</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0b0f;
      color: white;
      font-family: Arial, sans-serif;
    }

    .card {
      text-align: center;
      padding: 32px;
    }

    button {
      margin-top: 20px;
      padding: 14px 24px;
      border: 0;
      border-radius: 999px;
      background: #5b4cff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .error {
      color: #ff6b6b;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>GOLTH</h1>
    <p id="message">Connexion en cours…</p>
    <button id="openButton" hidden>Ouvrir GOLTH</button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("access_token");

    const message = document.getElementById("message");
    const button = document.getElementById("openButton");

    if (!token) {
      message.textContent = "Impossible de finaliser la connexion.";
      message.className = "error";
    } else {
      // Retire immédiatement le token de la barre d'adresse.
      history.replaceState({}, document.title, window.location.pathname);

      const deepLink =
        "golth://auth?access_token=" + encodeURIComponent(token);

      button.hidden = false;
      button.onclick = () => {
        window.location.href = deepLink;
      };

      // Tentative automatique de retour dans l'application.
      window.location.href = deepLink;

      setTimeout(() => {
        message.textContent =
          "Si GOLTH ne s'est pas ouvert automatiquement, appuyez sur le bouton.";
      }, 1500);
    }
  </script>
</body>
</html>
